<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
</style>
</helmet>

<div style="{{ pageStyle }}">
  <header style="{{ navStyle }}">
    <a href="#" style="{{ brandStyle }}">HotSeat</a>
    <nav style="{{ navLinksStyle }}">
      <a href="#" style="{{ navLinkStyle }}">Dashboard</a>
      <a href="#" style="{{ navLinkStyle }}">Resume</a>
      <a href="#" style="{{ navLinkActiveStyle }}">Generate Interview</a>
      <a href="#" style="{{ navLinkStyle }}">History</a>
    </nav>
    <div style="{{ navUserStyle }}">
      <span style="{{ avatarStyle }}">MC</span>
      <button type="button" style="{{ logoutButtonStyle }}">Log out</button>
    </div>
  </header>

  <main style="{{ mainStyle }}">
    <div style="{{ cardStyle }}">
      <div style="{{ eyebrowStyle }}">INTERVIEW SETUP</div>
      <h1 style="{{ headlineStyle }}">Configure your session</h1>
      <p style="{{ subStyle }}">HotSeat will generate a resume-tailored interview for the role and difficulty you choose below.</p>

      <div style="{{ formStyle }}">
        <label style="{{ fieldStyle }}">
          <span style="{{ fieldLabelStyle }}">Resume</span>
          <select style="{{ selectStyle }}">
            <sc-for list="{{ resumes }}" as="resume" hint-placeholder-count="2">
              <option>{{ resume.original_filename }}</option>
            </sc-for>
          </select>
          <span style="{{ fieldHintStyle }}">Questions will be tailored to this resume.</span>
        </label>

        <label style="{{ fieldStyle }}">
          <span style="{{ fieldLabelStyle }}">Role</span>
          <input type="text" placeholder="e.g. Backend Engineer" style="{{ inputStyle }}" />
        </label>

        <div style="{{ fieldStyle }}">
          <span style="{{ fieldLabelStyle }}">Difficulty</span>
          <div style="{{ segmentedRowStyle }}">
            <sc-for list="{{ difficulties }}" as="d" hint-placeholder-count="3">
              <span style="{{ d.style }}">{{ d.label }}</span>
            </sc-for>
          </div>
        </div>

        <button type="button" style="{{ submitButtonStyle }}">Enter the HotSeat</button>
      </div>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const CHAR = "oklch(0.16 0.011 45)";
const CHAR_RAISED = "oklch(0.21 0.013 45)";
const CHAR_BORDER = "oklch(0.31 0.015 45)";
const CHAR_TEXT = "oklch(0.94 0.006 70)";
const CHAR_TEXT_SOFT = "oklch(0.66 0.011 60)";
const ACCENT = "oklch(0.66 0.19 35)";

const DISPLAY = "'Space Grotesk', 'Inter', sans-serif";
const BODY = "'Inter', sans-serif";
const MONO = "'JetBrains Mono', monospace";

const segActive = { fontFamily: MONO, fontSize: "13.5px", fontWeight: 600, color: "#fff", background: ACCENT, padding: "10px 20px", borderRadius: "4px", flex: 1, textAlign: "center" };
const segInactive = { fontFamily: MONO, fontSize: "13.5px", fontWeight: 600, color: CHAR_TEXT, background: CHAR_RAISED, border: `1px solid ${CHAR_BORDER}`, padding: "10px 20px", borderRadius: "4px", flex: 1, textAlign: "center" };

class Component extends DCLogic {
  renderVals() {
    const resumes = [
      { original_filename: "Maya_Chen_Resume_2026.pdf" },
      { original_filename: "Maya_Chen_Resume_v1.pdf" },
    ];
    const difficulties = [
      { label: "Easy", style: segInactive },
      { label: "Medium", style: segActive },
      { label: "Hard", style: segInactive },
    ];

    return {
      resumes, difficulties,
      pageStyle: { background: CHAR, color: CHAR_TEXT, fontFamily: BODY, minHeight: "100vh" },

      navStyle: { position: "sticky", top: 0, zIndex: 10, display: "flex", alignItems: "center", justifyContent: "space-between", gap: "16px", padding: "16px clamp(20px, 5vw, 48px)", background: "oklch(0.16 0.011 45 / 0.94)", backdropFilter: "blur(12px)", borderBottom: `1px solid ${CHAR_BORDER}` },
      brandStyle: { fontFamily: DISPLAY, fontWeight: 700, fontSize: "19px", color: CHAR_TEXT, flexShrink: 0 },
      navLinksStyle: { display: "flex", gap: "clamp(8px, 2vw, 26px)", flexWrap: "wrap", flex: 1, justifyContent: "center" },
      navLinkStyle: { fontSize: "14px", fontWeight: 500, color: CHAR_TEXT_SOFT, padding: "6px 2px" },
      navLinkActiveStyle: { fontSize: "14px", fontWeight: 600, color: CHAR_TEXT, padding: "6px 2px", borderBottom: `2px solid ${ACCENT}` },
      navUserStyle: { display: "flex", alignItems: "center", gap: "12px", flexShrink: 0 },
      avatarStyle: { width: "32px", height: "32px", borderRadius: "50%", background: CHAR_RAISED, border: `1px solid ${CHAR_BORDER}`, color: CHAR_TEXT, display: "inline-flex", alignItems: "center", justifyContent: "center", fontFamily: MONO, fontSize: "12px", fontWeight: 600 },
      logoutButtonStyle: { border: `1px solid ${CHAR_BORDER}`, background: "transparent", color: CHAR_TEXT, fontSize: "13.5px", fontWeight: 600, padding: "7px 14px", borderRadius: "4px" },

      mainStyle: { display: "flex", justifyContent: "center", padding: "clamp(48px, 8vw, 96px) 20px" },
      cardStyle: { width: "100%", maxWidth: "540px", display: "flex", flexDirection: "column", gap: "6px" },
      eyebrowStyle: { fontFamily: MONO, fontSize: "12px", fontWeight: 600, letterSpacing: "0.1em", color: ACCENT },
      headlineStyle: { fontFamily: DISPLAY, fontSize: "clamp(28px, 3.4vw, 34px)", fontWeight: 700, margin: 0, color: CHAR_TEXT, letterSpacing: "-0.01em" },
      subStyle: { fontSize: "15px", color: CHAR_TEXT_SOFT, margin: "10px 0 28px", lineHeight: 1.55 },

      formStyle: { display: "flex", flexDirection: "column", gap: "22px" },
      fieldStyle: { display: "flex", flexDirection: "column", gap: "8px" },
      fieldLabelStyle: { fontSize: "13.5px", fontWeight: 600, color: CHAR_TEXT },
      fieldHintStyle: { fontSize: "12.5px", color: CHAR_TEXT_SOFT },
      selectStyle: { height: "46px", padding: "0 14px", border: `1px solid ${CHAR_BORDER}`, borderRadius: "4px", background: CHAR_RAISED, color: CHAR_TEXT, fontSize: "15px", fontFamily: BODY },
      inputStyle: { height: "46px", padding: "0 14px", border: `1px solid ${CHAR_BORDER}`, borderRadius: "4px", background: CHAR_RAISED, color: CHAR_TEXT, fontSize: "15px", fontFamily: BODY },
      segmentedRowStyle: { display: "flex", gap: "8px" },
      submitButtonStyle: { height: "50px", border: "none", borderRadius: "4px", background: ACCENT, color: "#fff", fontWeight: 700, fontSize: "16px", marginTop: "10px", letterSpacing: "0.01em" },
    };
  }
}

</script>
</body>
</html>
